[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceswap"
version = "0.1.0"
description = "Replace the voice in a video with an ElevenLabs voice, preserving timing via speech-to-speech."
requires-python = ">=3.9"
dependencies = [
    "elevenlabs>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
voiceswap = "voiceswap.cli:main"
revoice = "voiceswap.revoice_cli:main"

[tool.setuptools.packages.find]
include = ["voiceswap*"]
